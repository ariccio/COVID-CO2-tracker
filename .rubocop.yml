# The behavior of RuboCop can be controlled via the .rubocop.yml
# configuration file. It makes it possible to enable/disable
# certain cops (checks) and to alter their behavior if they accept
# any parameters. The file can be placed either in your home
# directory or in some project directory.
#
# RuboCop will start looking for the configuration file in the directory
# where the inspected file is and continue its way up to the root directory.
#
# See https://docs.rubocop.org/rubocop/configuration
plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot


Layout/EndOfLine:
  Enabled: false

Layout/LineLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ParenthesesAroundCondition:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/GuardClause:
  Enabled: false

Metrics/MethodLength:
  Max: 200
  Severity: info

Naming/PredicateMethod:
  Exclude:
    - 'app/controllers/concerns/export_authentication.rb'


Style/GlobalStdStream:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

# Rails cops configuration
Rails/TimeZone:
  Exclude:
    - 'config/boot.rb'
    - 'config/application.rb'
    - 'config/environments/*.rb'
  # These files run before Rails is initialized, so Time.zone is not available

Rails/Output:
  Enabled: false
  Severity: info

Metrics/BlockLength:
  Severity: info
  Max: 175
  Exclude:
    - 'lib/tasks/**/*.rake'
    - 'spec/**/*'
    - 'config/routes.rb'

Style/ConditionalAssignment:
  Enabled: false

Metrics/ClassLength:
  Severity: info
  Max: 500

Style/MethodCallWithoutArgsParentheses:
  Enabled: false

Style/RedundantConstantBase:
  Enabled: false

Layout/EmptyLinesAfterModuleInclusion:
  Enabled: true

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLines:
  Enabled: false

Layout/EmptyLinesAroundModuleBody:
  Enabled: false

Layout/IndentationConsistency:
  Enabled: false

Layout/CommentIndentation:
  Enabled: false

Layout/EmptyComment:
  Enabled: false

Layout/EmptyLinesAroundMethodBody:
  Enabled: false

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Style/CaseEquality:
  Severity: error
  
Style/FrozenStringLiteralComment:
  Severity: info

Style/WordArray:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Lint/Debugger:
  Severity: error

Lint/DuplicateBranch:
  Enabled: true

Lint/AmbiguousAssignment:
  Enabled: true

Lint/AmbiguousOperatorPrecedence:
  Enabled: true

Lint/AmbiguousRange:
  Enabled: true

Lint/ArrayLiteralInRegexp:
  Enabled: true

Lint/ConstantOverwrittenInRescue:
  Enabled: true

Lint/ConstantReassignment:
  Enabled: true

Lint/CopDirectiveSyntax:
  Enabled: true

Lint/DuplicateMagicComment:
  Enabled: true

Lint/DuplicateMatchPattern:
  Enabled: true

Lint/EmptyBlock:
  Enabled: true

Lint/EmptyClass:
  Enabled: true

Lint/EmptyConditionalBody:
  Enabled: true

Lint/EmptyInPattern:
  Enabled: true

Lint/HashNewWithKeywordArgumentsAsDefault:
  Enabled: true

Lint/IncompatibleIoSelectWithFiberScheduler:
  Enabled: true

Lint/NonAtomicFileOperation:
  Enabled: true

Lint/NumberedParameterAssignment:
  Enabled: true

# Lint/ConstantResolution:
#   Enabled: true

Lint/EmptyFile:
  Enabled: true

Lint/EmptyEnsure:
  Enabled: true

Lint/EmptyWhen:
  Enabled: true

Lint/MixedCaseRange:
  Enabled: true

Lint/NoReturnInBeginEndBlocks:
  Enabled: true

# Lint/NumberConversion:
#   Enabled: true
#   Severity: info

Lint/RedundantCopDisableDirective:
  Enabled: true

Lint/RefinementImportMethods:
  Enabled: true

Lint/RequireParentheses:
  Enabled: true

Lint/SelfAssignment:
  Enabled: true

Lint/SendWithMixinArgument:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/SymbolConversion:
  Enabled: true

Lint/ToEnumArguments:
  Enabled: true

Lint/UnreachableCode:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/UnusedMethodArgument:
  Enabled: true

Lint/UselessRescue:
  Enabled: true

Lint/Void:
  Enabled: true



Style/InverseMethods:
  Severity: info

Metrics/AbcSize:
  Enabled: true
  Max: 34
  # When fixing: see copilot_notes/REFACTOR_RISK_PATTERNS.md for safety checks

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 15

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 7

AllCops:
  ActiveSupportExtensionsEnabled: true
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/bundle'
    - 'bin/rails'
    - 'bin/setup'
    - 'bin/rake'
    - 'tmp/**/*'
    - 'co2_client/**/*'
    - 'co2_native_client/**/*'
  NewCops: enable
  SuggestExtensions: true

# RSpec Configuration - Aligned with project patterns
RSpec/ExampleLength:
  Max: 20  # Project uses longer integration tests
  Exclude:
    - 'spec/requests/**/*'  # Request specs often need more lines
    - 'spec/security/**/*'  # Security specs are comprehensive

RSpec/MultipleExpectations:
  Max: 15  # Allow multiple expectations for thorough testing
  Exclude:
    - 'spec/requests/**/*'  # Integration tests need multiple assertions
    - 'spec/security/**/*'  # Security tests verify multiple conditions

RSpec/MultipleMemoizedHelpers:
  Max: 15  # Complex tests need more setup
  Exclude:
    - 'spec/security/**/*'  # Security specs have extensive setup

RSpec/ContextWording:
  Enabled: false  # Project uses various context descriptions

RSpec/InstanceVariable:
  Exclude:
    - 'spec/requests/**/*'  # Sometimes needed for request specs
    - 'spec/security/**/*'  # Used in security test setup

RSpec/NestedGroups:
  Max: 4  # Allow deeper nesting for complex scenarios

# Configure RSpec to recognize custom expectation helpers
RSpec/NoExpectationExample:
  AllowedPatterns:
    - "^expect_"
    - "^assert_"
    - "check_no_error"
    - "formatted_error_check"

# RSpecRails Configuration - Pending cops explicitly enabled
RSpecRails/AvoidSetupHook:
  Enabled: true

RSpecRails/HaveHttpStatus:
  Enabled: true

RSpecRails/InferredSpecType:
  Enabled: true

RSpecRails/MinitestAssertions:
  Enabled: true


Rails/I18nLocaleTexts:
  Enabled: false

Naming/FileName:
  Severity: info

# Naming Configuration
Naming/VariableNumber:
  CheckMethodNames: false  # Allow numbered methods
  CheckSymbols: false
  AllowedIdentifiers:
    - 'e2e'
    - 'oauth2'
    - 'CO2'
    - 'co2'

Performance/ChainArrayAllocation:
  Enabled: true

Performance/ConstantRegexp:
  Enabled: true

Performance/MapMethodChain:
  Enabled: true

Performance/MethodObjectAsBlock:
  Enabled: true

Performance/RedundantEqualityComparisonBlock:
  Enabled: true

Performance/RedundantSortBlock:
  Enabled: true

Performance/RedundantSplitRegexpArgument:
  Enabled: true

Performance/ReverseFirst:
  Enabled: true

Performance/SelectMap:
  Enabled: true

Performance/SortReverse:
  Enabled: true

Performance/Squeeze:
  Enabled: true

Performance/StringIdentifierArgument:
  Enabled: true

Performance/StringInclude:
  Enabled: true

Performance/Sum:
  Enabled: true

Performance/ZipWithoutBlock:
  Enabled: true

# Rails Configuration
Rails/SkipsModelValidations:
  AllowedMethods:
    - 'touch'  # touch is generally safe
    - 'increment!'
    - 'decrement!'
  Exclude:
    - 'spec/**/*'  # Allowed in tests for setting up specific test conditions
    - 'test/**/*'

# Pending Rails Cops - Explicitly enabled
Rails/ActionControllerFlashBeforeRender:
