# Pending Style Cops - Explicitly enabled to catch potential improvements
# These are marked as "Pending" in RuboCop defaults, so we enable them explicitly

Style/ArgumentsForwarding:
  Enabled: true
  # Identifies places where arguments forwarding can be simplified

Style/ArrayIntersect:
  Enabled: true
  # Prefers Array#intersect? over (array1 & array2).any?

Style/CollectionCompact:
  Enabled: true
  # Prefers compact/compact! over custom nil rejection

Style/ComparableClamp:
  Enabled: true
  # Enforces use of Comparable#clamp instead of min/max comparisons

Style/DataInheritance:
  Enabled: true
  SafeAutoCorrect: false  # Marked as unsafe
  # Checks for inheritance from Data.define

Style/DirEmpty:
  Enabled: true
  # Prefers Dir.empty?('path') over Dir.entries('path').size == 2

Style/ExactRegexpMatch:
  Enabled: true
  # Enforces use of Regexp#match? over =~ when MatchData is not used

Style/FileEmpty:
  Enabled: true
  # Prefers File.empty?('path') over File.size('path') == 0

Style/FileRead:
  Enabled: true
  # Prefers File.read/binread/write/binwrite over File.open with block

Style/FileWrite:
  Enabled: true
  # Prefers File.write/binwrite over File.open with write mode

Style/HashExcept:
  Enabled: true
  # Prefers Hash#except over reject with specific keys

Style/IfWithBooleanLiteralBranches:
  Enabled: true
  SafeAutoCorrect: false  # Can change behavior with predicates
  # Detects if statements that return boolean literals

Style/MapCompactWithConditionalBlock:
  Enabled: true
  # Prefers filter_map over map { ... }.compact

Style/MapIntoArray:
  Enabled: true
  # Prefers literal arrays over map.to_a

Style/MapToHash:
  Enabled: true
  # Prefers to_h with block over map { }.to_h

Style/MapToSet:
  Enabled: true
  # Prefers Set.new with block over map.to_set

Style/MinMaxComparison:
  Enabled: true
  # Prefers [a, b].min over a < b ? a : b

Style/MultilineMethodSignature:
  Enabled: true
  # Checks for multiline method signatures

Style/NestedFileDirname:
  Enabled: true
  # Prefers __dir__ over File.dirname(__FILE__)

Style/NilLambda:
  Enabled: true
  # Checks for lambdas that always return nil

Style/NumberedParameters:
  Enabled: true
  EnforcedStyle: disallow
  # We prefer explicit parameter names for clarity

Style/NumberedParametersLimit:
  Enabled: true
  Max: 0  # Disallow numbered parameters entirely for clarity

Style/ObjectThen:
  Enabled: true
  EnforcedStyle: then
  # Prefers .then over .yield_self

Style/OpenStructUse:
  Enabled: true
  # Discourages OpenStruct use (performance/security concerns)

Style/OperatorMethodCall:
  Enabled: true
  # Checks for redundant operator method calls

Style/QuotedSymbols:
  Enabled: true
  EnforcedStyle: same_as_string_literals
  # Aligns quoted symbol style with string literal style

Style/RedundantArrayConstructor:
  Enabled: true
  # Detects redundant Array constructor calls

Style/RedundantCurrentDirectoryInPath:
  Enabled: true
  # Removes unnecessary './' from paths

Style/RedundantDoubleSplatHashBraces:
  Enabled: true
  # Removes redundant braces in double splat

Style/RedundantEach:
  Enabled: true
  # Detects redundant .each calls

Style/RedundantFilterChain:
  Enabled: true
  # Simplifies chained select/reject/filter calls

Style/RedundantHeredocDelimiterQuotes:
  Enabled: true
  # Removes unnecessary quotes from heredoc delimiters

Style/RedundantInitialize:
  Enabled: true
  # Detects unnecessary initialize methods

Style/RedundantLineContinuation:
  Enabled: true
  # Removes unnecessary line continuations

Style/RedundantRegexpArgument:
  Enabled: true
  # Simplifies regexp arguments

Style/RedundantRegexpConstructor:
  Enabled: true
  # Detects redundant Regexp.new calls

Style/RedundantStringEscape:
  Enabled: true
  # Removes unnecessary string escapes

Style/RequireOrder:
  Enabled: true
  # Enforces consistent ordering of require statements

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: true
  # Ensures predicate methods don't explicitly return nil

Style/SelectByRegexp:
  Enabled: true
  # Prefers select/reject with regexp over block with match

Style/SendWithLiteralMethodName:
  Enabled: true
  # Prefers public_send over send with literal method names

Style/SingleLineDoEndBlock:
  Enabled: true
  # Checks for single-line do...end blocks

Style/StringChars:
  Enabled: true
  # Prefers chars over split('') or split(//)

Style/SuperArguments:
  Enabled: true
  # Checks for redundant arguments in super calls

Style/SuperWithArgsParentheses:
  Enabled: true
  # Enforces parentheses with super arguments

Style/SymbolProc:
  Enabled: false  # Often less readable than explicit blocks

Style/TopLevelMethodDefinition:
  Enabled: false
  Severity: info
  # Warns about top-level method definitions

Style/UnlessLogicalOperators:
  Enabled: true
  EnforcedStyle: forbid_mixed_logical_operators
  # EnforcedStyle: forbid_logical_operators
  # # Forbids && and || in unless conditions (confusing)

Style/YAMLFileRead:
  Enabled: true
  # Prefers YAML.load_file over File.read + YAML.load

# When fixing ABC complexity, see: copilot_notes/RUBOCOP_FIRST_RESPONSE.md
